<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test pulsanti — Runebound Arena</title><style>body{font:16px system-ui;background:#17142c;color:white;padding:22px;line-height:1.6}button,a{padding:12px;background:#ffcd69;color:#241c39;border-radius:10px;font-weight:700}#report{white-space:pre-wrap;background:#282341;padding:16px;border-radius:12px}iframe{width:100%;height:380px;border:2px solid #ad91db;border-radius:14px}</style></head><body><h1>Test dei pulsanti v3.3</h1><p>Questa pagina prova i tre pulsanti del menu con il motore di gioco reale. Non cancella i salvataggi.</p><button id="test">Esegui test</button><p id="report">In attesa.</p><iframe id="gameframe" src="./index.html?v=3.3" title="Gioco di prova"></iframe><p><a href="./index.html?v=3.3">Apri il gioco</a></p><script>const frame=document.getElementById('gameframe'),out=document.getElementById('report');document.getElementById('test').onclick=()=>{const w=frame.contentWindow,d=w.document;const lines=[];try{const info=w.rbaMenuDiagnostic?.();lines.push('Motore: '+(info?.ready?'OK':'NON PRONTO'));for(const [id,modal] of [['menucampaign','campaign'],['menucollection','bestiary']]){d.getElementById('homebutton')?.click();d.getElementById(id)?.click();const ok=!d.getElementById(modal)?.hidden;lines.push(id+': '+(ok?'OK':'ERRORE'));d.getElementById('homebutton')?.click();d.getElementById(modal).hidden=true}d.getElementById('menubattle')?.click();lines.push('menubattle: '+(d.getElementById('mainmenu').hidden?'OK':'ERRORE'));}catch(e){lines.push('ERRORE: '+e.message)}out.textContent=lines.join('\n')};</script></body></html>
