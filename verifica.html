<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101627"><title>Verifica installazione — Runebound Arena</title><style>body{font:16px system-ui,sans-serif;background:#101627;color:#f3efff;margin:0;padding:24px}main{max-width:680px;margin:auto}h1{font-size:1.7rem}p{line-height:1.55}.item{padding:12px 14px;background:#202642;border-radius:12px;margin:9px 0}.ok{border-left:5px solid #73d9a1}.bad{border-left:5px solid #ff7e89}.warn{border-left:5px solid #ffd47a}a{color:#b5d6ff}button{padding:12px;border-radius:12px;background:#8665e7;color:white;border:0;font-weight:bold}</style></head><body><main><h1>🛠️ Verifica Runebound Arena 2.7</h1><p>Questa pagina controlla che il gioco sia pronto per il browser. Per la grafica 3D serve anche una connessione a internet alla prima apertura, perché Three.js viene caricato da un servizio esterno.</p><div id="results" aria-live="polite">Controlli in corso…</div><p><a href="./">← Torna al gioco</a></p><button id="again">Ripeti verifica</button></main><script>
const files=['index.html','style.css','game.js','arena3d.js','display.js','menu.js','inspection.js','manifest.webmanifest','icon-192.png','icon-512.png','apple-touch-icon.png'];
const out=document.querySelector('#results');function item(name,state,detail){let d=document.createElement('div');d.className='item '+state;d.textContent=(state==='ok'?'✓ ':state==='bad'?'✕ ':'! ')+name+(detail?' — '+detail:'');out.append(d)}
async function check(){out.replaceChildren();item('Connessione HTTPS',location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'?'ok':'warn',location.protocol==='https:'?'attiva':'necessaria per installazione PWA su iPhone');
const c=document.createElement('canvas');let gl=null;try{gl=c.getContext('webgl2')||c.getContext('webgl')}catch{}item('Grafica WebGL',gl?'ok':'bad',gl?'disponibile':'non disponibile: controlla Safari e le impostazioni del dispositivo');
item('Service Worker',('serviceWorker' in navigator)?'ok':'warn',('serviceWorker' in navigator)?'supportato':'non disponibile in questo contesto');
for(const f of files){try{const r=await fetch('./'+f,{cache:'no-store'});item(f,r.ok?'ok':'bad','HTTP '+r.status)}catch(e){item(f,'bad','rete non disponibile')}}
try{const r=await fetch('https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js',{method:'HEAD',mode:'cors',cache:'no-store'});item('Libreria 3D esterna (Three.js)',r.ok?'ok':'warn',r.ok?'raggiungibile':'controllare connessione/CDN')}catch(e){item('Libreria 3D esterna (Three.js)','warn','non raggiungibile; il 3D potrebbe non caricarsi')}
}document.querySelector('#again').addEventListener('click',check);check();</script></body></html>
